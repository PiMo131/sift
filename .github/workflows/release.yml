# Windows-distributie van Sift: lichte installer + offline-bundels, als release-assets bij een tag v*.
# Zelfde stappen als installer\build.ps1 (lokaal testen: .\installer\build.ps1 -Variant all).
# Er zijn geen secrets nodig: GITHUB_TOKEN volstaat voor het aanmaken van de release.
name: Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: Lichte installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Versie uit sift/__init__.py
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path sift/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Sift $v"
          if ("${{ github.ref }}" -like "refs/tags/v*" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "tag ${{ github.ref_name }} komt niet overeen met __version__ = $v"
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /? | Select-Object -First 1

      - name: Bouwen
        shell: pwsh
        run: ./installer/build.ps1 -Variant light

      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: installer/dist/Sift-Setup-*.exe
          if-no-files-found: error

  offline:
    name: Offline-bundel (${{ matrix.variant }})
    needs: installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: setup
          path: installer/dist

      - name: Wheels downloaden en bundelen
        shell: pwsh
        run: ./installer/build.ps1 -Variant offline-${{ matrix.variant }} -SkipInstaller

      - uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.variant }}
          path: |
            installer/dist/Sift-Offline-*.zip
            installer/dist/Sift-Offline-*.zip.*
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub Release
    # Publiceert zodra de lichte installer er is, ook als een offline-bundel mislukt (die ontbreekt dan in de release).
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.installer.result == 'success' }}
    needs: [installer, offline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Assets
        run: ls -la assets

      - uses: softprops/action-gh-release@v2
        with:
          name: Sift ${{ needs.installer.outputs.version }}
          generate_release_notes: true
          files: |
            assets/Sift-Setup-*.exe
            assets/Sift-Offline-*.zip
            assets/Sift-Offline-*.zip.*
          body: |
            **Windows**
            - `Sift-Setup-<versie>.exe`: lichte installer; de eerste start downloadt de Python-onderdelen (ca. 1 GB zonder, 3,5 GB met NVIDIA-GPU).
            - `Sift-Offline-CPU-<versie>.zip` / `Sift-Offline-GPU-<versie>.zip.001+.002`: installer plus alle onderdelen, voor computers zonder internet. Zie `LEESMIJ.txt` in het archief en [docs/INSTALL.md](https://github.com/PiMo131/sift/blob/main/docs/INSTALL.md).

            De Whisper-modellen worden bij de eerste transcriptie gedownload.
